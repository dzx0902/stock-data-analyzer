[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-agent"
version = "0.1.0"
description = "Feishu gold market analysis agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "lark-oapi>=1.4",
    "openai>=1.30",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gold-agent = "gold_agent.app:main"

[tool.setuptools.packages.find]
include = ["gold_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
